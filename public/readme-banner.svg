<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Bridget Hu's Digital Garden</title>
  <desc id="description">A warm botanical banner with an original pixel farm vignette.</desc>
  <defs>
